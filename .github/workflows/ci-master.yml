name: ci-master

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff + eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- Backend lint ---
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - run: ruff check app
        working-directory: backend

      # --- Frontend lint ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend

  test-backend-coverage:
    name: Backend coverage (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: backend
      - name: Ejecutar pytest con cobertura
        run: |
          pytest --cov=app --cov-report=term-missing \
                 --cov-report=xml:coverage.xml \
                 --cov-fail-under=80 \
                 --tb=short
        working-directory: backend
      # Ajustar rutas en coverage.xml para que Sonar encuentre los archivos
      - name: Ajustar rutas en coverage.xml para SonarCloud
        run: |
          sed -i 's|filename="|filename="backend/app/|g' backend/coverage.xml
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-backend
          path: backend/coverage.xml

  test-frontend-coverage:
    name: Frontend coverage (>=80%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.11.1"
      - run: npm install --no-audit --no-fund
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage/lcov.info

  sonarcloud:
    name: SonarCloud Quality Gate
    needs: [test-backend-coverage, test-frontend-coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: coverage-backend
          path: backend
        continue-on-error: true
      - uses: actions/download-artifact@v4
        with:
          name: coverage-frontend
          path: frontend/coverage
        continue-on-error: true
      - uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-docker:
    name: Build de imagenes Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t lab-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t lab-frontend:ci ./frontend
