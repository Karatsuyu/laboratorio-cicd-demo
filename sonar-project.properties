# ============================================================
# Reemplaza ORG con tu usuario de GitHub (en minúsculas)
# Reemplaza ORG_laboratorio-cicd-demo con el PROJECT_KEY que
# SonarCloud asignó al importar el repo (normalmente es
# "<tu-usuario>_laboratorio-cicd-demo")
# ============================================================
sonar.organization=ORG
sonar.projectKey=ORG_laboratorio-cicd-demo
sonar.projectName=Laboratorio CI/CD Demo

# Qué analizar
sonar.sources=backend/app,frontend/src
sonar.tests=backend/tests,frontend/src/__tests__
sonar.exclusions=**/node_modules/**,**/__tests__/**,**/coverage/**,**/dist/**,**/*.test.*,**/*.spec.*

# Cobertura backend (pytest-cov genera coverage.xml)
sonar.python.coverage.reportPaths=backend/coverage.xml

# Cobertura frontend (Vitest genera lcov.info en frontend/coverage/)
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info

# Versión de Python
sonar.python.version=3.12

# Codificación
sonar.sourceEncoding=UTF-8
