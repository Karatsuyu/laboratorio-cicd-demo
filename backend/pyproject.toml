[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# E = pycodestyle errores
# F = pyflakes (imports / variables no usadas)
# I = orden de imports (isort)
# B = bugbear (bugs comunes)
# UP = pyupgrade (sintaxis moderna)

[tool.coverage.run]
source = ["app"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
